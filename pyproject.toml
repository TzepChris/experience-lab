[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "experience-lab"
version = "0.1.0"
description = "CPU-only symbolic SwitchWorld lab for learning hidden door rules from interaction."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Experience Lab" }]
dependencies = [
    "numpy",
    "matplotlib",
    "pyyaml",
    "pytest",
]

[project.scripts]
experience-lab = "experience_lab.cli:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
